name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: 의존성
        run: uv sync --locked
      - name: 경로 검사 (평가 자료·로컬 링크 추적 금지)
        run: uv run python tools/check_tracked_paths.py --tracked
      - name: 린트
        run: uv run ruff check .
      - name: 테스트 (평가 정답 없이, tests 경로만)
        run: uv run pytest tests
