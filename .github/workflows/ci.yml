name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: 의존성
        run: uv sync --locked
      - name: 경로 검사 (평가 자료·로컬 링크 추적 금지)
        run: uv run python tools/check_tracked_paths.py --tracked
      - name: 린트
        run: uv run ruff check .
      - name: 테스트 (평가 정답 없이, tests 경로만)
        run: uv run pytest tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 의존성
        run: npm ci
      - name: 타입 검사·빌드
        run: npm run build

  e2e:
    # ubuntu-latest가 26.04로 바뀐 뒤 고정한 Playwright(1.56)가 브라우저를 설치하지 못한다(2026-11-05부터).
    # Playwright를 올릴 때까지 지원되는 24.04에 고정한다.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Python 의존성
        run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 화면 의존성·브라우저
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - name: 빌드
        working-directory: web
        run: npm run build
      - name: E2E (S1·S2·S3·S5·SC03·SC04·SC07·SC12, 개발 입력만)
        working-directory: web
        run: npm run e2e
