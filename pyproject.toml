[project]
name = "data-preprocessing-automation"
version = "0.0.0"
description = "여러 담당자가 만든 쇼핑몰 데이터를 승인 기반으로 표준화하는 로컬 프로토타입"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "httpx2>=2.16.0",
    "pytest>=8",
    "ruff>=0.6",
]
# scripts/compare_mysql_csv.py 전용 (선택): uv sync --group mysql
mysql = ["PyMySQL[rsa]>=1.1.1,<2"]

[tool.uv]
# 설치용 패키지가 아니라 앱 저장소다. 실행 의존성은 기능을 구현할 때 추가한다.
package = false

[tool.pytest.ini_options]
# 기본 수집은 tests/로 한정한다. scripts/test_*.py는 평가 자료를 읽는
# 데이터셋 구축 검증 도구라 수집·실행하지 않는다 (docs/development-plan.md 3절).
# 인자 없는 실행에만 적용되므로 Makefile·CI는 `pytest tests`처럼 경로를 명시한다.
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120
# scripts/: 데이터셋 구축 도구(서비스 코드 아님). docs/: 검토 기록용 스크립트.
extend-exclude = ["scripts", "docs"]

[tool.ruff.lint]
# ruff 버전마다 기본 규칙이 달라지므로 명시한다.
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# 기존 코드는 M0-4 회귀 기준(T-01)을 만들기 전에 고치지 않는다.
# 해당 파일을 수정하는 작업에서 이 목록의 그 파일 항목을 지우고 정리한다.
"diagnostics/cleaning.py" = ["E701", "E702", "E401", "E402", "I001", "F401", "UP017", "B904", "B905"]
"tests/test_classification.py" = ["E701", "E702", "I001"]
"tests/test_cleaning.py" = ["E701", "E702", "I001", "F841"]
"tests/test_diagnostics.py" = ["E701", "E702", "E402", "I001", "F401"]
